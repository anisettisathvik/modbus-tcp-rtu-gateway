# Modbus TCP/RTU gateway configuration
# Every key here has a --flag equivalent for commissioning overrides.

tcp_port            = 5050

# Drive a real serial bus. Comment out to use the in-process slave instead.
serial_port         = /tmp/gw_serial
baud                = 19200
response_timeout_ms = 300

# In-process backend only (ignored when serial_port is set)
units               = 17,34,51

# Deterministic fault injection, replayable by seed
inject_drop         = 0.0
inject_corrupt      = 0.0
inject_seed         = 42
